name: release-maven

on:
  # An auditable release request committed to main also triggers this workflow.
  push:
    branches: [main]
    paths: ['.github/release-request.txt']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release (example: 0.3.17, must match current SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: bjorm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Resolve release version
        id: release_input
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_VERSION="$(tr -d '[:space:]' < .github/release-request.txt)"
          else
            RELEASE_VERSION="$MANUAL_VERSION"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate release and compute next snapshot
        id: versions
        env:
          RELEASE_VERSION: ${{ steps.release_input.outputs.release_version }}
        run: |
          python3 scripts/release_version.py prepare "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "Release tag already exists" >&2
            exit 1
          fi
      - name: Set release version in every module
        env:
          RELEASE_VERSION: ${{ steps.release_input.outputs.release_version }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$RELEASE_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false
          python3 scripts/release_version.py check-release "$RELEASE_VERSION"
      - name: Verify release
        run: |
          mvn -B -ntp -pl bjorm-core,bjorm-processor -am -DskipTests install
          mvn -B -ntp clean verify
          bash scripts/verify.sh
      - name: Commit and tag release on main
        env:
          RELEASE_VERSION: ${{ steps.release_input.outputs.release_version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml bjorm-*/pom.xml
          git commit -m "chore(release): v${RELEASE_VERSION}"
          git tag "v${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${RELEASE_VERSION}"
      - name: Publish stable Maven artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -pl bjorm-core,bjorm-processor,bjorm-spring-boot -am -DskipTests deploy
      - name: Prepare next development snapshot
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next_snapshot }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$NEXT_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false
          python3 scripts/release_version.py check-snapshot "$NEXT_VERSION"
          git add pom.xml bjorm-*/pom.xml
          git commit -m "chore: begin ${NEXT_VERSION}"
          git push origin HEAD:main
