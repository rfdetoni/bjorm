name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install annotation processor for Maven plugin resolution
        run: mvn -B -ntp -pl bjorm-core,bjorm-processor -am -DskipTests install
      - name: Build Maven reactor
        run: mvn -B -ntp clean verify
      - name: Run generated-code and critical behavioral checks
        run: bash scripts/verify.sh

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bjorm
          POSTGRES_PASSWORD: bjorm_test
          POSTGRES_DB: bjorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bjorm -d bjorm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BJORM_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/bjorm_test
      BJORM_TEST_USER: bjorm
      BJORM_TEST_PASSWORD: bjorm_test
      BJORM_DRIVER_JAR: bjorm-examples/target/postgresql-42.7.7.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and obtain PostgreSQL JDBC driver
        run: |
          mvn -B -ntp -pl bjorm-core,bjorm-processor -am -DskipTests install
          mvn -B -ntp -pl bjorm-examples -am verify
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
            -Dartifact=org.postgresql:postgresql:42.7.7 \
            -DoutputDirectory=bjorm-examples/target
      - name: Verify against real PostgreSQL
        run: bash scripts/verify.sh

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: bjorm_test
          MYSQL_USER: bjorm
          MYSQL_PASSWORD: bjorm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u bjorm -pbjorm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      BJORM_MYSQL_JDBC_URL: jdbc:mysql://localhost:3306/bjorm_test?sslMode=DISABLED
      BJORM_MYSQL_USER: bjorm
      BJORM_MYSQL_PASSWORD: bjorm_test
      BJORM_MYSQL_DRIVER_JAR: bjorm-examples/target/mysql-connector-j-9.4.0.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and fetch MySQL JDBC driver
        run: |
          mvn -B -ntp -pl bjorm-core,bjorm-processor -am -DskipTests install
          mvn -B -ntp -pl bjorm-examples -am verify
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
            -Dartifact=com.mysql:mysql-connector-j:9.4.0 \
            -DoutputDirectory=bjorm-examples/target
      - name: Verify with real MySQL 8.4
        run: bash scripts/verify.sh

  publish-snapshot:
    name: Publish verified Maven snapshot
    needs: [java, postgres, mysql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish snapshots only after all verification jobs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -pl bjorm-core,bjorm-processor,bjorm-spring-boot -am -DskipTests deploy
