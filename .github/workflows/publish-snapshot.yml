name: publish-snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bjorm-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Confirm snapshot version
        run: |
          python3 scripts/release_version.py check-snapshot
      - name: Validate project before publishing
        run: |
          mvn -B -ntp clean verify
          bash scripts/verify.sh
      - name: Publish library snapshots to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -pl bjorm-core,bjorm-processor,bjorm-spring-boot -am -DskipTests deploy
